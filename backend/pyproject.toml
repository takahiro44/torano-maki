[project]
name = "torano-maki-backend"
version = "0.1.0"
description = "営業ナレッジの蓄積・探索・ロープレのバックエンド"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    # 埋め込みは各自のPCのCPUで行う（DGX上のvLLMは固定モデルのみ配信しており
    # 埋め込みを載せられないため）。PyTorchを含むため導入に3〜4GBかかるが、
    # 検索を1回でも叩く人は全員必要になるので任意グループには分けない。
    # 詳細は docs/decisions.md を参照。
    # 6.0 で get_embedding_dimension に改名されたため 6.0 以上を要求する
    "sentence-transformers>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
