[project]
name = "knowledge-extraction-experiment"
version = "0.1.0"
description = "商談文字起こしから構造化ナレッジを抽出する検証"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
